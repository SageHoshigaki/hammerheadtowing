[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA — all routes fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/request-recovery"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/company"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/location"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/prestige/*"
  to = "/index.html"
  status = 200

# Catch-all SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
